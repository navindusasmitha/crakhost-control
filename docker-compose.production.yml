services:
  migrate:
    image: postgres:16-alpine
    restart: "no"
    env_file: .env
    entrypoint: ["/bin/sh","/migrate.sh"]
    volumes:
      - ./docker/migrate.sh:/migrate.sh:ro
      - ./database/migrations:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks: [crakhost]

  panel:
    build:
      context: .
      dockerfile: docker/panel.Dockerfile
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:4310:4310"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    networks: [crakhost]

networks:
  crakhost:
    name: crakhost
