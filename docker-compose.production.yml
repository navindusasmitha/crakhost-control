services:
  migrate:
    image: postgres:16-alpine
    restart: "no"
    env_file: .env
    entrypoint: ["/bin/sh","/migrate.sh"]
    volumes:
      - ./docker/migrate.sh:/migrate.sh:ro
      - ./database/migrations:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks: [crakhost]

  panel:
    build:
      context: .
      dockerfile: docker/panel.Dockerfile
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:4310:4310"
    volumes:
      - /run/crakhost-updater:/run/crakhost-updater:ro
    group_add:
      - "${CRAKHOST_UPDATER_GID:-991}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:4310/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 25s
    networks: [crakhost]

  commerce-cleanup:
    image: alpine:3.20
    restart: unless-stopped
    env_file: .env
    environment:
      CRAKHOST_CRON_SECRET: ${CRAKHOST_CRON_SECRET:?CRAKHOST_CRON_SECRET is required}
      CRAKHOST_COMMERCE_CLEANUP_SECONDS: ${CRAKHOST_COMMERCE_CLEANUP_SECONDS:-3600}
    depends_on:
      panel:
        condition: service_healthy
    command:
      - /bin/sh
      - -c
      - |
        sleep 60
        while true; do
          wget -qO- --timeout=20 --header="x-crakhost-cron-secret: $${CRAKHOST_CRON_SECRET}" --post-data="" http://panel:4310/api/internal/commerce/cleanup || true
          sleep "$${CRAKHOST_COMMERCE_CLEANUP_SECONDS:-3600}"
        done
    networks: [crakhost]

  alert-dispatcher:
    image: alpine:3.20
    restart: unless-stopped
    env_file: .env
    environment:
      CRAKHOST_CRON_SECRET: ${CRAKHOST_CRON_SECRET:?CRAKHOST_CRON_SECRET is required}
    depends_on:
      panel:
        condition: service_healthy
    command:
      - /bin/sh
      - -c
      - |
        sleep 20
        while true; do
          echo "[CrakHost Status] collecting minute sample..."
          if result=$$(wget -qO- --timeout=30 --header="x-crakhost-cron-secret: $${CRAKHOST_CRON_SECRET}" --post-data="" "http://panel:4310/api/internal/status/sample?probe=1" 2>&1); then
            echo "[CrakHost Status] $$result"
          else
            echo "[CrakHost Status] collector request failed: $$result" >&2
          fi
          wget -qO- --timeout=30 --header="x-crakhost-cron-secret: $${CRAKHOST_CRON_SECRET}" --post-data="" http://panel:4310/api/internal/alerts/dispatch || true
          sleep 60
        done
    networks: [crakhost]

networks:
  crakhost:
    name: crakhost
