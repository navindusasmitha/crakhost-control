services:
  panel:
    build:
      context: .
      dockerfile: docker/panel.Dockerfile
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:4310:4310"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks: [crakhost]

networks:
  crakhost:
    name: crakhost
