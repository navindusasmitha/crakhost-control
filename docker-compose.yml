name: crakhost-control
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: crakhost
      POSTGRES_USER: crakhost
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crakhost -d crakhost"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [crakhost]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks: [crakhost]

  craknode:
    image: golang:1.23-alpine
    restart: unless-stopped
    working_dir: /app
    environment:
      CRAKNODE_TOKEN: ${CRAKNODE_TOKEN:?CRAKNODE_TOKEN is required}
      CRAKNODE_BACKUP_DIR: /backups
      CRAKNODE_CAPACITY_PATH: /backups
      CRAKNODE_TRANSFER_LISTEN: :8089
      CRAKNODE_TRANSFER_MAX_MB: ${CRAKNODE_TRANSFER_MAX_MB:-512}
      CRAKNODE_DNS_PRIMARY: ${DOCKER_DNS_1:-1.1.1.1}
      CRAKNODE_DNS_SECONDARY: ${DOCKER_DNS_2:-8.8.8.8}
      CRAKNODE_PANEL_URL: ${CRAKNODE_PANEL_URL:-http://panel:4310}
      CRAKNODE_REGISTRATION_TOKEN: ${CRAKNODE_REGISTRATION_TOKEN:-}
      CRAKNODE_NAME: ${CRAKNODE_NAME:-}
      CRAKNODE_LOCATION: ${CRAKNODE_LOCATION:-}
      CRAKNODE_PUBLIC_URL: ${CRAKNODE_PUBLIC_URL:-http://craknode:8088}
      CRAKNODE_HEARTBEAT_INTERVAL: ${CRAKNODE_HEARTBEAT_INTERVAL:-60}
    volumes:
      - ./services/craknode:/app:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - craknode_backups:/backups
    command: sh -c "apk add --no-cache docker-cli wget >/dev/null && go run ."
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --header='Authorization: Bearer '$$CRAKNODE_TOKEN http://127.0.0.1:8089/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 4s
      retries: 12
      start_period: 25s
    networks: [crakhost]

volumes:
  pgdata:
    name: ${CRAKHOST_PGDATA_VOLUME:-crakhost-pgdata}
  craknode_backups:
    name: ${CRAKHOST_BACKUPS_VOLUME:-crakhost-node-backups}

networks:
  crakhost:
    name: crakhost
