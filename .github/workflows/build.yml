name: CrakHost Build Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  panel-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi
      - name: Production build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run build

  craknode-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Compile CrakNode
        working-directory: services/craknode
        run: go test ./...

  crakmail-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate shell scripts
        run: |
          bash -n services/crakmail/entrypoint.sh
          bash -n services/crakmail/sync-dkim.sh
          bash -n scripts/check-crakmail-network.sh
          bash -n scripts/install-crakmail-host.sh
      - name: Build CrakMail image
        run: docker build -f services/crakmail/Dockerfile -t crakmail-ci .
      - name: Validate mail Compose overlay
        env:
          POSTGRES_PASSWORD: ci-postgres-password
          MAIL_DOMAIN: example.com
          MAIL_HOSTNAME: mail.example.com
          MAIL_PUBLIC_IP: 203.0.113.10
          CRAKNODE_TOKEN: ci-node-token
        run: |
          cp .env.example .env
          sed -i 's|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=ci-postgres-password|' .env
          sed -i 's|^CRAKNODE_TOKEN=.*|CRAKNODE_TOKEN=ci-node-token|' .env
          sed -i 's|^MAIL_DOMAIN=.*|MAIL_DOMAIN=example.com|' .env
          sed -i 's|^MAIL_HOSTNAME=.*|MAIL_HOSTNAME=mail.example.com|' .env
          sed -i 's|^MAIL_PUBLIC_IP=.*|MAIL_PUBLIC_IP=203.0.113.10|' .env
          docker compose -f docker-compose.yml -f docker-compose.production.yml -f docker-compose.mail.yml config >/dev/null
