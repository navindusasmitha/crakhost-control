name: CrakHost Build Gate

on:
  push:
    branches: [main, v026-stability-overhaul]
  pull_request:
    branches: [main]

jobs:
  panel-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
