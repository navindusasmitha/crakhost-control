name: CrakHost Build Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  panel-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi
      - name: Production build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run build

  database-migrations:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: crakhost
          POSTGRES_USER: crakhost
          POSTGRES_PASSWORD: ci-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crakhost -d crakhost"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client
      - name: Apply fresh schema and migrations twice
        env:
          PGPASSWORD: ci-postgres-password
        run: |
          DB=(psql -h 127.0.0.1 -U crakhost -d crakhost -v ON_ERROR_STOP=1)
          "${DB[@]}" -f database/init.sql >/dev/null
          for pass in 1 2; do
            echo "Migration pass $pass"
            for f in $(find database/migrations -maxdepth 1 -type f -name 'v*.sql' | sort -V); do
              echo "  -> $f"
              "${DB[@]}" -f "$f" >/dev/null
            done
          done
      - name: Verify commerce schema
        env:
          PGPASSWORD: ci-postgres-password
        run: |
          psql -h 127.0.0.1 -U crakhost -d crakhost -v ON_ERROR_STOP=1 <<'SQL'
          select idempotency_key from orders limit 0;
          select server_id,kind,period_start,period_end from invoices limit 0;
          do $$
          begin
            if not exists (
              select 1 from pg_constraint
              where conname='invoices_status_check'
                and pg_get_constraintdef(oid) like '%REFUNDED%'
            ) then
              raise exception 'REFUNDED is missing from invoices_status_check';
            end if;
          end $$;
          SQL

  craknode-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Compile CrakNode
        working-directory: services/craknode
        run: go test ./...

  crakmail-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate host and mail scripts
        run: |
          bash -n install.sh
          bash -n scripts/update-production.sh
          bash -n scripts/install-updater-agent.sh
          bash -n scripts/repair-production.sh
          bash -n services/crakmail/entrypoint.sh
          bash -n services/crakmail/sync-dkim.sh
          bash -n scripts/check-crakmail-network.sh
          bash -n scripts/install-crakmail-host.sh
          python3 -m py_compile services/updater/server.py
      - name: Smoke test updater Unix socket
        run: |
          TOKEN=ci-deploy-token-012345678901234567890123456789
          rm -rf /tmp/crakhost-updater-ci
          mkdir -p /tmp/crakhost-updater-ci
          printf '#!/usr/bin/env bash\nexit 0\n' > /tmp/crakhost-updater-ci/true.sh
          chmod +x /tmp/crakhost-updater-ci/true.sh
          CRAKHOST_DEPLOY_TOKEN="$TOKEN" \
          CRAKHOST_UPDATER_SOCKET=/tmp/crakhost-updater-ci/updater.sock \
          CRAKHOST_UPDATER_STATE=/tmp/crakhost-updater-ci/state.json \
          CRAKHOST_UPDATER_LOG=/tmp/crakhost-updater-ci/updater.log \
          CRAKHOST_UPDATE_SCRIPT=/tmp/crakhost-updater-ci/true.sh \
          CRAKHOST_UPDATE_ROOT="$GITHUB_WORKSPACE" \
          python3 services/updater/server.py &
          AGENT_PID=$!
          trap 'kill "$AGENT_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            [ -S /tmp/crakhost-updater-ci/updater.sock ] && break
            sleep 0.2
          done
          curl -fsS --unix-socket /tmp/crakhost-updater-ci/updater.sock -H "x-crakhost-deploy-token: $TOKEN" http://localhost/health >/dev/null
          curl -fsS --unix-socket /tmp/crakhost-updater-ci/updater.sock -H "x-crakhost-deploy-token: $TOKEN" -X POST http://localhost/update >/dev/null
          sleep 0.5
          curl -fsS --unix-socket /tmp/crakhost-updater-ci/updater.sock -H "x-crakhost-deploy-token: $TOKEN" http://localhost/status | grep -q '"status": "success"'
      - name: Build CrakMail image
        run: docker build -f services/crakmail/Dockerfile -t crakmail-ci .
      - name: Validate production Compose overlays
        env:
          POSTGRES_PASSWORD: ci-postgres-password
          MAIL_DOMAIN: example.com
          MAIL_HOSTNAME: mail.example.com
          MAIL_PUBLIC_IP: 203.0.113.10
          CRAKNODE_TOKEN: ci-node-token
        run: |
          cp .env.example .env
          sed -i 's|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=ci-postgres-password|' .env
          sed -i 's|^CRAKNODE_TOKEN=.*|CRAKNODE_TOKEN=ci-node-token|' .env
          sed -i 's|^CRAKHOST_DEPLOY_TOKEN=.*|CRAKHOST_DEPLOY_TOKEN=ci-deploy-token-012345678901234567890123456789|' .env
          sed -i 's|^MAIL_DOMAIN=.*|MAIL_DOMAIN=example.com|' .env
          sed -i 's|^MAIL_HOSTNAME=.*|MAIL_HOSTNAME=mail.example.com|' .env
          sed -i 's|^MAIL_PUBLIC_IP=.*|MAIL_PUBLIC_IP=203.0.113.10|' .env
          docker compose -f docker-compose.yml -f docker-compose.production.yml config >/dev/null
          docker compose -f docker-compose.yml -f docker-compose.production.yml -f docker-compose.mail.yml config >/dev/null
